
workflows:
  riderwise-ios-334:
    name: RiderWise AI 3.3.4 - iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Extract source
        script: |
          set -euo pipefail
          mkdir -p _source
          unzip -q RiderWiseAI_iOS_3.3.4_ScreenCaptureKit.zip -d _source
          PROJECT_FILE="$(find "$CM_BUILD_DIR/_source" -name project.yml -print -quit)"
          test -n "$PROJECT_FILE"
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$CM_ENV"

      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd "$PROJECT_DIR"
          xcodegen generate
          xcodebuild -resolvePackageDependencies \
            -project RiderWiseAI.xcodeproj \
            -scheme RiderWiseAI

      - name: Build simulator
        script: |
          cd "$PROJECT_DIR"
          set -o pipefail
          xcodebuild -project RiderWiseAI.xcodeproj \
            -scheme RiderWiseAI \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$CM_BUILD_DIR/simulator-build.log"

      - name: Archive iOS device app
        script: |
          cd "$PROJECT_DIR"
          set -o pipefail
          xcodebuild -project RiderWiseAI.xcodeproj \
            -scheme RiderWiseAI \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/RiderWiseAI.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive \
            2>&1 | tee "$CM_BUILD_DIR/device-archive.log"

      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/RiderWiseAI.xcarchive/Products/Applications/RiderWiseAI.app"
          test -d "$APP"
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/ipa/Payload/"
          cd "$CM_BUILD_DIR/ipa"
          zip -qry "$CM_BUILD_DIR/RiderWiseAI-3.3.4-unsigned.ipa" Payload
          unzip -tq "$CM_BUILD_DIR/RiderWiseAI-3.3.4-unsigned.ipa"

    artifacts:
      - RiderWiseAI-3.3.4-unsigned.ipa
      - RiderWiseAI.xcarchive
      - simulator-build.log
      - device-archive.log
