
workflows:
  ios-unsigned-ipa:
    name: RiderWise AI 3.3.4 - Downloadable IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Extract source ZIP
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/source"

          SOURCE_ZIP=$(find "$CM_BUILD_DIR" -maxdepth 2 \
            -name '*DEVICEFIX*.zip' -print -quit)

          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP not found"
            exit 1
          fi

          unzip -oq "$SOURCE_ZIP" -d "$CM_BUILD_DIR/source"

          PROJECT_YML=$(find "$CM_BUILD_DIR/source" \
            -name project.yml -print -quit)

          if [ -z "$PROJECT_YML" ]; then
            echo "ERROR: project.yml not found"
            exit 1
          fi

          dirname "$PROJECT_YML" > "$CM_BUILD_DIR/project_path.txt"

      - name: Install XcodeGen
        script: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        script: |
          set -euo pipefail
          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_path.txt")
          cd "$PROJECT_DIR"

          xcodegen generate --spec project.yml

          xcodebuild -list \
            -project RiderWiseAI.xcodeproj

      - name: Resolve dependencies
        script: |
          set -euo pipefail
          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_path.txt")
          cd "$PROJECT_DIR"

          xcodebuild -resolvePackageDependencies \
            -project RiderWiseAI.xcodeproj \
            -scheme RiderWiseAI

      - name: Build iPhone app
        script: |
          set -euo pipefail
          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_path.txt")
          cd "$PROJECT_DIR"

          xcodebuild \
            -project RiderWiseAI.xcodeproj \
            -scheme RiderWiseAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/derived" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Create downloadable IPA
        script: |
          set -euo pipefail

          APP="$CM_BUILD_DIR/build/derived/Build/Products/Release-iphoneos/RiderWiseAI.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Built app not found"
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/Payload"
          mkdir -p "$CM_BUILD_DIR/Payload"

          cp -R "$APP" "$CM_BUILD_DIR/Payload/"

          cd "$CM_BUILD_DIR"

          rm -f RiderWiseAI-3.3.4-unsigned.ipa

          /usr/bin/zip -qry \
            RiderWiseAI-3.3.4-unsigned.ipa Payload

          test -s RiderWiseAI-3.3.4-unsigned.ipa

          echo "SUCCESS: IPA CREATED"
          ls -lh RiderWiseAI-3.3.4-unsigned.ipa

          rm -rf "$CM_BUILD_DIR/Payload"

    artifacts:
      - RiderWiseAI-3.3.4-unsigned.ipa
      - build/derived/Logs/**/*.xcresult
      - build/derived/Build/Products/Release-iphoneos/*.app
