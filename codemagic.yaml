workflows:
  ios-unsigned-ipa:
    name: Build Unsigned iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Build unsigned iOS app
        script: |
          # If using Flutter, use: flutter build ios --release --no-codesign
          # If using native Xcode / React Native, use:
          xcodebuild -workspace ios/YourApp.xcworkspace \
            -scheme YourApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package .app into unsigned .ipa
        script: |
          mkdir -p Payload
          cp -r build/derived/Build/Products/Release-iphoneos/*.app Payload/
          # (For Flutter, copy from build/ios/iphoneos/*.app instead)
          zip -r YourApp-unsigned.ipa Payload
    artifacts:
      - YourApp-unsigned.ipa
