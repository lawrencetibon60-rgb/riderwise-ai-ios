workflows:
  riderwise-ios-334:
    name: RiderWise AI 3.3.4 - iOS Device Archive
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 27.1

    scripts:
      - name: Check and extract fixed source archive
        script: |
          set -euo pipefail
          ZIP="$CM_BUILD_DIR/RiderWiseAI_iOS_3.3.4_ScreenCaptureKit_FIXED.zip"
          test -f "$ZIP"
          unzip -tq "$ZIP"
          mkdir -p "$CM_BUILD_DIR/_riderwise_source"
          unzip -q "$ZIP" -d "$CM_BUILD_DIR/_riderwise_source"
          PROJECT_FILE="$(find "$CM_BUILD_DIR/_riderwise_source" -type f -name project.yml -print -quit)"
          test -n "$PROJECT_FILE"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "Using project: $PROJECT_FILE"

      - name: Show Xcode version
        script: |
          xcodebuild -version
          xcodegen --version || true

      - name: Install XcodeGen
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project and resolve packages
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodegen generate
          test -d RiderWiseAI.xcodeproj
          xcodebuild -resolvePackageDependencies \
            -project RiderWiseAI.xcodeproj \
            -scheme RiderWiseAI

      - name: Archive physical iOS app (no Simulator build)
        script: |
          set -o pipefail
          cd "$PROJECT_DIR"
          xcodebuild -project RiderWiseAI.xcodeproj \
            -scheme RiderWiseAI \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/RiderWiseAI.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee "$CM_BUILD_DIR/device-archive.log"

      - name: Verify archive and package unsigned IPA
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/RiderWiseAI.xcarchive/Products/Applications/RiderWiseAI.app"
          test -d "$APP"
          test ! -d "$APP/PlugIns/RiderWiseBroadcast.appex"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          test "$BUNDLE_ID" = "ph.riderwise.ai"
          test "$VERSION" = "3.3.4"
          test "$BUILD" = "334"

          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/ipa/Payload/"
          (cd "$CM_BUILD_DIR/ipa" && /usr/bin/zip -qry "$CM_BUILD_DIR/RiderWiseAI-3.3.4-unsigned.ipa" Payload)
          unzip -tq "$CM_BUILD_DIR/RiderWiseAI-3.3.4-unsigned.ipa"

    artifacts:
      - RiderWiseAI-3.3.4-unsigned.ipa
      - build/RiderWiseAI.xcarchive
      - device-archive.log
