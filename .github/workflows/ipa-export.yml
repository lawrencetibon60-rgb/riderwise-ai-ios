name: RiderWise IPA Export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ipa-export.yml"
      - "RiderWiseAI_iOS_3.1.0_Complete.zip"

jobs:
  build-and-export:
    runs-on: xcode-27

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract iOS project
        run: unzip -q RiderWiseAI_iOS_3.1.0_Complete.zip

      - name: Verify Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Run Swift tests
        working-directory: RiderWiseAI_iOS_3.1.0_Complete
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: RiderWiseAI_iOS_3.1.0_Complete
        run: xcodegen generate

      - name: Build iOS Device
        working-directory: RiderWiseAI_iOS_3.1.0_Complete
        run: |
          xcodebuild \
            -project RiderWiseAI.xcodeproj \
            -scheme RiderWiseAI \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/RiderWiseDerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned iOS IPA
        working-directory: RiderWiseAI_iOS_3.1.0_Complete
        run: |
          APP_PATH="$RUNNER_TEMP/RiderWiseDerivedData/Build/Products/Debug-iphoneos/RiderWiseAI.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Could not find the built RiderWiseAI.app at: $APP_PATH"
            find "$RUNNER_TEMP/RiderWiseDerivedData/Build/Products" -maxdepth 4 -print || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/RiderWiseAI.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/RiderWiseAI-unsigned.ipa" Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiderWiseAI-unsigned-IPA
          path: RiderWiseAI-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
