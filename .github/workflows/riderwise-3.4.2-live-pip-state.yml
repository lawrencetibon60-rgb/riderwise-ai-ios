name: RiderWise AI 3.4.2 - Live PiP State Fix

on:
  workflow_dispatch:
  push:
    paths:
      - "RiderWiseAI_iOS_3.4.2_LivePiP_StateFix_GitHub.zip"
      - ".github/workflows/riderwise-3.4.2-live-pip-state.yml"

permissions:
  contents: read

jobs:
  portable-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/RiderWiseAI_iOS_3.4.2_LivePiP_StateFix_GitHub.zip"
          test -f "$ZIP"
          unzip -tq "$ZIP"
          mkdir -p "$RUNNER_TEMP/riderwise-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/riderwise-source"
          PROJECT_FILE="$(find "$RUNNER_TEMP/riderwise-source" -type f -name project.yml -print -quit)"
          test -n "$PROJECT_FILE"
          echo "SOURCE_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"
      - name: Run portable tests and source checks
        run: bash "$SOURCE_DIR/scripts/verify-portable.sh"

  ios-device-build:
    needs: portable-audit
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/riderwise-source"
          unzip -q "$GITHUB_WORKSPACE/RiderWiseAI_iOS_3.4.2_LivePiP_StateFix_GitHub.zip" -d "$RUNNER_TEMP/riderwise-source"
          PROJECT_FILE="$(find "$RUNNER_TEMP/riderwise-source" -type f -name project.yml -print -quit)"
          test -n "$PROJECT_FILE"
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and resolve packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project RiderWiseAI.xcodeproj -scheme RiderWiseAI
      - name: Build iOS simulator
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          xcodebuild -project RiderWiseAI.xcodeproj -scheme RiderWiseAI -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/riderwise-sim" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/simulator-build.log"
      - name: Archive unsigned iOS device app
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          xcodebuild -project RiderWiseAI.xcodeproj -scheme RiderWiseAI -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/RiderWiseAI.xcarchive" CODE_SIGNING_ALLOWED=NO archive 2>&1 | tee "$RUNNER_TEMP/device-archive.log"
      - name: Verify archive metadata
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/RiderWiseAI.xcarchive/Products/Applications/RiderWiseAI.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -qx 'ph.riderwise.ai'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -qx '3.4.2'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -qx '342'
          /usr/libexec/PlistBuddy -c 'Print :NSScreenCaptureUsageDescription' "$APP/Info.plist" >/dev/null
          find "$APP" -type f \( -name 'luzon_psgc_3q_2026.json' -o -name 'luzon_psgc_3q_2026.json.gz' \) -print -quit | grep -q .
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/RiderWiseAI.xcarchive/Products/Applications/RiderWiseAI.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$RUNNER_TEMP/RiderWiseAI-3.4.2-unsigned.ipa" Payload)
          unzip -tq "$RUNNER_TEMP/RiderWiseAI-3.4.2-unsigned.ipa"
      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiderWiseAI-3.4.2-LivePiP-StateFix-Build
          path: |
            ${{ runner.temp }}/RiderWiseAI-3.4.2-unsigned.ipa
            ${{ runner.temp }}/simulator-build.log
            ${{ runner.temp }}/device-archive.log
          if-no-files-found: warn
          retention-days: 14
