name: RiderWise AI 3.3.2 - Full Audit and iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - "RiderWiseAI_iOS_3.3.2_NativePiP.zip"
      - ".github/workflows/riderwise-3.3.2-audit-build.yml"

permissions:
  contents: read

jobs:
  portable-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Extract and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/RiderWiseAI_iOS_3.3.2_NativePiP.zip"
          test -f "$ZIP" || { echo "::error::Upload RiderWiseAI_iOS_3.3.2_NativePiP.zip to repository root."; exit 1; }
          mkdir -p "$RUNNER_TEMP/riderwise-source"
          unzip -tq "$ZIP"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/riderwise-source"
          PROJECT_FILE="$(find "$RUNNER_TEMP/riderwise-source" -type f -name project.yml -print -quit)"
          test -n "$PROJECT_FILE"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "SOURCE_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Run all portable tests and source/resource checks
        run: bash "$SOURCE_DIR/scripts/verify-portable.sh"

  ios-device-build:
    needs: portable-audit
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/RiderWiseAI_iOS_3.3.2_NativePiP.zip"
          test -f "$ZIP" || { echo "::error::Source ZIP not found at repository root."; exit 1; }
          mkdir -p "$RUNNER_TEMP/riderwise-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/riderwise-source"
          PROJECT_FILE="$(find "$RUNNER_TEMP/riderwise-source" -type f -name project.yml -print -quit)"
          test -n "$PROJECT_FILE"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project and resolve packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project RiderWiseAI.xcodeproj -scheme RiderWiseAI
      - name: Build iOS simulator
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          xcodebuild -project RiderWiseAI.xcodeproj -scheme RiderWiseAI \\
            -sdk iphonesimulator -configuration Debug \\
            -destination 'generic/platform=iOS Simulator' \\
            -derivedDataPath "$RUNNER_TEMP/riderwise-sim" \\
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/simulator-build.log"
      - name: Archive unsigned iOS device app
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          xcodebuild -project RiderWiseAI.xcodeproj -scheme RiderWiseAI \\
            -sdk iphoneos -configuration Release \\
            -destination 'generic/platform=iOS' \\
            -archivePath "$RUNNER_TEMP/RiderWiseAI.xcarchive" \\
            CODE_SIGNING_ALLOWED=NO archive 2>&1 | tee "$RUNNER_TEMP/device-archive.log"
      - name: Verify archived app metadata, geography and PiP-only scope
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/RiderWiseAI.xcarchive/Products/Applications/RiderWiseAI.app"
          test -d "$APP" || { echo "::error::Archived app bundle missing."; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -qx 'ph.riderwise.ai'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -qx '3.3.2'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -qx '332'
          PSGC="$(find "$APP" -type f -name 'luzon_psgc_3q_2026.json' -print -quit)"
          if [[ -z "$PSGC" ]]; then
            PSGC="$(find "$APP" -type f -name 'luzon_psgc_3q_2026.json.gz' -print -quit)"
          fi
          if [[ -z "$PSGC" ]]; then
            echo "::error::Luzon PSGC JSON asset not found anywhere inside app/framework bundles."
            find "$APP" -maxdepth 7 -type f | sort | head -300
            exit 1
          fi
          echo "Geographic asset packaged at: $PSGC"
          test -d "$APP/PlugIns/RiderWiseBroadcast.appex" || { echo "::error::ReplayKit broadcast extension missing."; exit 1; }
          if find "$APP/PlugIns" -maxdepth 1 -type d -iname '*LiveActivity*' -print -quit | grep -q .; then
            echo "::error::Live Activity extension found; RiderWise must remain PiP-only."
            exit 1
          fi
          echo "Archive metadata, geographic resource and PiP-only extension checks passed."
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/RiderWiseAI.xcarchive/Products/Applications/RiderWiseAI.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$RUNNER_TEMP/RiderWiseAI-3.3.2-unsigned.ipa" Payload)
          unzip -tq "$RUNNER_TEMP/RiderWiseAI-3.3.2-unsigned.ipa"
      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiderWiseAI-3.3.2-iOS-Build
          path: |
            ${{ runner.temp }}/RiderWiseAI-3.3.2-unsigned.ipa
            ${{ runner.temp }}/simulator-build.log
            ${{ runner.temp }}/device-archive.log
          if-no-files-found: warn
          retention-days: 14
