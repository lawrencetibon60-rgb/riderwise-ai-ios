name: RiderWise AI 3.5.0 - Combined Audit, Device Archive and IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "RiderWiseAI_iOS_3.5.0*.zip"
      - "Sources/**"
      - "iOSApp/**"
      - "Tests/**"
      - "project.yml"
      - "Package.swift"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: riderwise-ios-combined-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Tests + Xcode 27 device archive + IPA artifact
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare output folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/riderwise-artifacts" "$RUNNER_TEMP/riderwise-logs" "$RUNNER_TEMP/riderwise-source"
          echo "ARTIFACT_DIR=$RUNNER_TEMP/riderwise-artifacts" >> "$GITHUB_ENV"
          echo "LOG_DIR=$RUNNER_TEMP/riderwise-logs" >> "$GITHUB_ENV"

      - name: Verify Xcode 27 toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION" | tee "$RUNNER_TEMP/riderwise-logs/xcode-version.log"
          if ! grep -Eq '^Xcode 27([.]|$)' <<< "$XCODE_VERSION"; then
            echo "ERROR: RiderWise 3.5.0 uses iOS 27 ScreenCaptureKit APIs. Select an Xcode 27.x runner."
            exit 1
          fi
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Locate and extract source ZIP or use checked-in source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname 'RiderWiseAI_iOS_3.5.0*.zip' -print -quit)"
          if [[ -n "$ZIP" ]]; then
            echo "Using source archive: $(basename "$ZIP")"
            unzip -tq "$ZIP"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/riderwise-source"
            SOURCE_ROOT="$RUNNER_TEMP/riderwise-source"
          else
            echo "No source ZIP at repository root; checking out the committed project files."
            SOURCE_ROOT="$GITHUB_WORKSPACE"
          fi
          PROJECT_FILE="$(find "$SOURCE_ROOT" -type f -name project.yml -print -quit)"
          test -n "$PROJECT_FILE" || {
            echo "ERROR: project.yml was not found in the uploaded ZIP or repository."
            find "$SOURCE_ROOT" -maxdepth 5 -print | head -300
            exit 1
          }
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          test -f "$PROJECT_DIR/scripts/verify-portable.sh"
          if ! grep -Fq 'MARKETING_VERSION: "3.5.0"' "$PROJECT_DIR/project.yml"; then
            echo "ERROR: The selected source archive is not RiderWise AI 3.5.0. Remove old 3.4.9 ZIP files and upload the 3.5.0 source ZIP."
            grep -n 'MARKETING_VERSION\|CURRENT_PROJECT_VERSION' "$PROJECT_DIR/project.yml" || true
            exit 1
          fi
          if ! grep -Fq 'CURRENT_PROJECT_VERSION: "350"' "$PROJECT_DIR/project.yml"; then
            echo "ERROR: Expected RiderWise AI build number 350 in project.yml."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Source project: $PROJECT_DIR"

      - name: Run portable Swift tests and source audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bash scripts/verify-portable.sh 2>&1 | tee "$LOG_DIR/portable-audit.log"

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project and resolve packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodegen generate 2>&1 | tee "$LOG_DIR/xcodegen.log"
          xcodebuild -resolvePackageDependencies \
            -project RiderWiseAI.xcodeproj \
            -scheme RiderWiseAI 2>&1 | tee "$LOG_DIR/package-resolution.log"

      - name: Build iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodebuild -jobs 2 \
            -project RiderWiseAI.xcodeproj \
            -scheme RiderWiseAI \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/riderwise-simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$LOG_DIR/simulator-build.log"

      - name: Archive for physical iOS devices (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodebuild -jobs 2 \
            -project RiderWiseAI.xcodeproj \
            -scheme RiderWiseAI \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARTIFACT_DIR/RiderWiseAI-3.5.0.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee "$LOG_DIR/device-archive.log"

      - name: Verify archived app and capture configuration
        shell: bash
        run: |
          set -euo pipefail
          APP="$ARTIFACT_DIR/RiderWiseAI-3.5.0.xcarchive/Products/Applications/RiderWiseAI.app"
          test -d "$APP"
          test -s "$APP/Info.plist"
          python3 - "$APP" "$PROJECT_DIR" <<'PY'
          import os, plistlib, sys

          app, project = sys.argv[1], sys.argv[2]
          with open(os.path.join(app, "Info.plist"), "rb") as f:
              info = plistlib.load(f)

          checks = {
              "bundle identifier": info.get("CFBundleIdentifier") == "ph.riderwise.ai",
              "marketing version": info.get("CFBundleShortVersionString") == "3.5.0",
              "build number": str(info.get("CFBundleVersion")) == "350",
              "screen capture usage description": bool(info.get("NSScreenCaptureUsageDescription")),
              "screen-capture background mode": "screen-capture" in info.get("UIBackgroundModes", []),
          }

          ent_path = os.path.join(project, "iOSApp", "RiderWiseAI.entitlements")
          if os.path.isfile(ent_path):
              with open(ent_path, "rb") as f:
                  entitlements = plistlib.load(f)
              checks["screen-recording entitlement declaration"] = (
                  entitlements.get("com.apple.developer.screen-recording") is True
              )
          else:
              checks["screen-recording entitlement file exists"] = False

          required_resources = {
              "Luzon PSGC resource in archived app": "luzon_psgc_3q_2026.json",
              "Geographic centroids resource in archived app": "geographic_centroids_legacy.json",
              "Upgrade configuration resource in archived app": "riderwise_upgrade_config.json",
          }
          archived_files = {}
          for folder, _, files in os.walk(app):
              for filename in files:
                  archived_files.setdefault(filename, os.path.join(folder, filename))
          for label, filename in required_resources.items():
              path = archived_files.get(filename)
              checks[label] = bool(path and os.path.getsize(path) > 0)
              if path:
                  print(f"RESOURCE: {filename} -> {os.path.relpath(path, app)} ({os.path.getsize(path)} bytes)")

          for label, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'}: {label}")

          if not all(checks.values()):
              sys.exit("Archive verification failed; inspect the FAIL line(s) above.")
          print("3.5.0 archive metadata, capture declarations and Luzon resources verified.")
          PY

      - name: Package and enforce IPA size limit
        shell: bash
        run: |
          set -euo pipefail
          APP="$ARTIFACT_DIR/RiderWiseAI-3.5.0.xcarchive/Products/Applications/RiderWiseAI.app"
          mkdir -p "$RUNNER_TEMP/riderwise-ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/riderwise-ipa/Payload/RiderWiseAI.app"
          (cd "$RUNNER_TEMP/riderwise-ipa" && /usr/bin/zip -qry -9 "$ARTIFACT_DIR/RiderWiseAI-3.5.0-unsigned.ipa" Payload)
          unzip -tq "$ARTIFACT_DIR/RiderWiseAI-3.5.0-unsigned.ipa"
          IPA_BYTES="$(stat -f%z "$ARTIFACT_DIR/RiderWiseAI-3.5.0-unsigned.ipa")"
          IPA_LIMIT_BYTES=25000000
          echo "Unsigned IPA size: ${IPA_BYTES} bytes (limit: ${IPA_LIMIT_BYTES} bytes)"
          if (( IPA_BYTES > IPA_LIMIT_BYTES )); then
            echo "ERROR: IPA is larger than 25,000,000 bytes. Build artifact is not being reported as release-ready."
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            "$ARTIFACT_DIR/RiderWiseAI-3.5.0.xcarchive" \
            "$ARTIFACT_DIR/RiderWiseAI-3.5.0.xcarchive.zip"
          ls -lh "$ARTIFACT_DIR"

      - name: Upload IPA, Xcode archive and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiderWiseAI-3.5.0-FullBuild-IPA-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/riderwise-artifacts/RiderWiseAI-3.5.0-unsigned.ipa
            ${{ runner.temp }}/riderwise-artifacts/RiderWiseAI-3.5.0.xcarchive.zip
            ${{ runner.temp }}/riderwise-logs/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
