name: RiderWise AI iOS Device Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: riderwise-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-audit:
    name: Portable tests and source audit
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/project.yml"
          test -f "$GITHUB_WORKSPACE/Package.swift"
          test -f "$GITHUB_WORKSPACE/scripts/verify-portable.sh"
          test -d "$GITHUB_WORKSPACE/iOSApp"
          test -d "$GITHUB_WORKSPACE/Sources/RiderWiseCore"
          echo "SOURCE_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Run Swift tests and source checks
        run: bash "$SOURCE_DIR/scripts/verify-portable.sh"

  ios-device-build:
    name: iOS simulator build and unsigned device archive
    needs: portable-audit
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/project.yml"
          test -f "$GITHUB_WORKSPACE/Package.swift"
          test -d "$GITHUB_WORKSPACE/iOSApp"
          test -d "$GITHUB_WORKSPACE/Sources/RiderWiseCore"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Show Apple build tools
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project and resolve packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -resolvePackageDependencies \
            -project RiderWiseAI.xcodeproj \
            -scheme RiderWiseAI

      - name: Build iOS Simulator target
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -jobs 2 \
            -project RiderWiseAI.xcodeproj \
            -scheme RiderWiseAI \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/riderwise-sim" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/simulator-build.log"

      - name: Archive unsigned iOS device app
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -jobs 2 \
            -project RiderWiseAI.xcodeproj \
            -scheme RiderWiseAI \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RiderWiseAI.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive 2>&1 | tee "$RUNNER_TEMP/device-archive.log"

      - name: Verify archived app metadata and required resources
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/RiderWiseAI.xcarchive/Products/Applications/RiderWiseAI.app"
          test -d "$APP"
          test -s "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -qx 'ph.riderwise.ai'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -qx '3.4.9'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -qx '349'
          /usr/libexec/PlistBuddy -c 'Print :NSScreenCaptureUsageDescription' "$APP/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist" | grep -q 'screen-capture'
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist" | grep -q 'audio'
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.screen-recording' iOSApp/RiderWiseAI.entitlements | grep -qx 'true'
          find "$APP" -type f \( -name 'luzon_psgc_3q_2026.json' -o -name 'luzon_psgc_3q_2026.json.gz' \) -print -quit | grep -q .

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/RiderWiseAI.xcarchive/Products/Applications/RiderWiseAI.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$RUNNER_TEMP/RiderWiseAI-3.4.9-unsigned.ipa" Payload)
          unzip -tq "$RUNNER_TEMP/RiderWiseAI-3.4.9-unsigned.ipa"

      - name: Upload IPA and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiderWiseAI-3.4.9-iOS-Build
          path: |
            ${{ runner.temp }}/RiderWiseAI-3.4.9-unsigned.ipa
            ${{ runner.temp }}/simulator-build.log
            ${{ runner.temp }}/device-archive.log
          if-no-files-found: warn
          retention-days: 14
