name: RiderWise AI 3.3.0 Verification First

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Locate and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=""
          for candidate in \
            "RiderWiseAI_iOS_3.3.0_VerificationFirst_Intelligence.zip" \
            "RiderWiseAI_iOS_3.3.0_VerificationFirst_Intelligence_FIXED.zip" \
            "RiderWiseAI_iOS_3.3.0_VerificationFirst_Intelligence_ARCHFIX.zip" \
            "RiderWiseAI_iOS_3.3.0_VerificationFirst_Intelligence_VERIFYFIX.zip"; do
            if [ -f "$candidate" ]; then
              ZIP_FILE="$candidate"
              break
            fi
          done
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found in repository root. Upload the standard, _FIXED, or _ARCHFIX 3.3.0 ZIP."
            echo "Root files:"
            ls -la
            exit 1
          fi
          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE"
          test -d RiderWiseAI_iOS_3.1.0_Complete

      - name: Verify geographic data
        run: |
          python3 - <<'PY'
          import json
          p='RiderWiseAI_iOS_3.1.0_Complete/Sources/RiderWiseCore/luzon_psgc_3q_2026.json'
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          assert len(d['records']) == d['recordCount']
          print('PSGC records:', len(d['records']))
          PY

      - name: Run core tests
        working-directory: RiderWiseAI_iOS_3.1.0_Complete
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: RiderWiseAI_iOS_3.1.0_Complete
        run: xcodegen generate

      - name: Build Simulator
        working-directory: RiderWiseAI_iOS_3.1.0_Complete
        run: xcodebuild -project RiderWiseAI.xcodeproj -scheme RiderWiseAI -sdk iphonesimulator -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build

      - name: Archive unsigned iOS app
        working-directory: RiderWiseAI_iOS_3.1.0_Complete
        run: xcodebuild -project RiderWiseAI.xcodeproj -scheme RiderWiseAI -destination 'generic/platform=iOS' -configuration Release -archivePath "$RUNNER_TEMP/RiderWiseAI.xcarchive" CODE_SIGNING_ALLOWED=NO archive

      - name: Diagnose and verify archived app contents
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/RiderWiseAI.xcarchive/Products/Applications/RiderWiseAI.app"
          test -d "$APP" || { echo "::error::Archived RiderWiseAI.app is missing"; exit 1; }

          echo "=== Geographic JSON assets found in archive ==="
          find "$APP" -type f \( -name 'luzon_psgc_3q_2026.json' -o -name 'luzon_psgc_3q_2026.json.gz' \) -print || true

          PSGC_FILE="$(find "$APP" -type f -name 'luzon_psgc_3q_2026.json' -print -quit || true)"
          PSGC_GZ="$(find "$APP" -type f -name 'luzon_psgc_3q_2026.json.gz' -print -quit || true)"
          if [ -z "$PSGC_FILE" ] && [ -z "$PSGC_GZ" ]; then
            echo "::error::Neither the plain nor compressed Luzon PSGC index was bundled in the archived app."
            echo "=== App bundle resource inventory (first 250 files) ==="
            find "$APP" -maxdepth 6 -type f | head -250
            exit 1
          fi

          echo "=== Embedded app extensions ==="
          if [ -d "$APP/PlugIns" ]; then
            find "$APP/PlugIns" -maxdepth 2 -print
          else
            echo "No PlugIns directory exists."
          fi

          LIVE_ACTIVITY=""
          if [ -d "$APP/PlugIns" ]; then
            LIVE_ACTIVITY="$(find "$APP/PlugIns" -maxdepth 1 -type d -name '*LiveActivity*.appex' -print -quit || true)"
          fi
          if [ -n "$LIVE_ACTIVITY" ]; then
            echo "::error::A Live Activity extension is embedded: $LIVE_ACTIVITY"
            echo "This needs removal from the XcodeGen target/dependency configuration, not a relaxed check."
            exit 1
          fi

          echo "Geographic asset check passed."
          echo "No LiveActivity-named app extension found; PiP-only naming check passed."

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/RiderWiseAI.xcarchive/Products/Applications/RiderWiseAI.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/RiderWiseAI-3.3.0-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RiderWiseAI-3.3.0-unsigned-IPA
          path: RiderWiseAI-3.3.0-unsigned.ipa
          retention-days: 7
